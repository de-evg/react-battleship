name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  verify:
    name: Линт, типы, тесты, сборка
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Линт
        run: npm run lint

      - name: Проверка типов
        run: npm run typecheck

      - name: Тесты
        run: npm test

      - name: Сборка
        run: npm run build
